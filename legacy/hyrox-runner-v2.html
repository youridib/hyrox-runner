<title>Hyrox Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  color-scheme: dark light;
  --bg: #0a0a0b;
  --surface: #131316;
  --surface-2: #1c1c20;
  --border: #26262c;
  --border-hover: #383840;
  --text: #f0f0f2;
  --text-muted: #8a8a90;
  --text-dim: #56565a;
  --intervals: #f4a825;
  --tempo: #ec5a80;
  --long: #4cc39d;
  --compromised: #a68af7;
  --hyrox: #7a7a82;
  --shakeout: #5a5a62;
  --race: #ef4444;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --border: #e5e5e7;
    --border-hover: #cfcfd4;
    --text: #18181b;
    --text-muted: #71717a;
    --text-dim: #a1a1aa;
    --intervals: #b45309;
    --tempo: #be185d;
    --long: #047857;
    --compromised: #6d28d9;
    --hyrox: #52525b;
    --shakeout: #71717a;
    --race: #dc2626;
  }
}
/* Native app feel: no tap highlights, no long-press callouts, no overscroll bounce */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
html, body { overscroll-behavior: none; }
input, select, textarea, [contenteditable] {
  -webkit-user-select: auto;
  user-select: auto;
  -webkit-touch-callout: default;
}
/* Standalone-mode adjustments: use safe-area insets fully */
@media (display-mode: standalone) {
  body { user-select: none; -webkit-user-select: none; }
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
.mono {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  font-feature-settings: 'zero', 'ss01';
}
.app {
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 20px 60px;
  min-height: 100%;
}
button { font-family: inherit; }

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 36px;
}
.wordmark {
  font-family: 'JetBrains Mono';
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.settings-btn {
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  padding: 8px;
  margin: -8px;
  border-radius: 8px;
  transition: color 0.15s, background 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.settings-btn:hover { color: var(--text); background: var(--surface); }

/* Phase hero */
.phase-hero { margin-bottom: 36px; }
.phase-eyebrow {
  font-family: 'JetBrains Mono';
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.phase-label {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.025em;
  margin: 0 0 6px;
  line-height: 1.1;
}
.phase-meta {
  font-family: 'JetBrains Mono';
  font-size: 13px;
  color: var(--text-muted);
}
.phase-meta .num { color: var(--text); font-weight: 500; }
.phase-desc {
  margin: 14px 0 0;
  font-size: 14px;
  color: var(--text-muted);
  max-width: 42ch;
}

/* Race week banner */
.race-week-banner {
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.10), rgba(239, 68, 68, 0.02));
  border: 1px solid rgba(239, 68, 68, 0.28);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 28px;
}
.race-week-banner .label {
  font-family: 'JetBrains Mono';
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--race);
  margin-bottom: 6px;
}
.race-week-banner .title { font-size: 16px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.01em; }
.race-week-banner .desc { font-size: 13px; color: var(--text-muted); }

/* Today */
.today {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 36px;
  position: relative;
  overflow: hidden;
}
.today::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, var(--accent-glow, transparent) 0%, transparent 60%);
  opacity: 0.08;
  pointer-events: none;
}
.today-eyebrow {
  font-family: 'JetBrains Mono';
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 14px;
  display: flex;
  gap: 10px;
  align-items: center;
  position: relative;
}
.today-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.025em;
  margin: 0 0 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  line-height: 1.2;
  position: relative;
}
.today-title .dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 12px 0 currentColor;
}
.today-pace {
  font-family: 'JetBrains Mono';
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 16px;
  position: relative;
}
.today-details {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.6;
  position: relative;
}

.day-row-expanded {

  margin-bottom: 10px;

.day-row-expanded .why {
  font-size: 12px;
  color: var(--text-dim);

  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-dim);

}
.type-picker {
  display: flex;
  flex-wrap: wrap;

  font-weight: 500;

.type-chip:hover { color: var(--text); border-color: var(--border-hover); }
.type-chip.active {

.type-chip.type-auto.active {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border-hover);
}

.pace-zones { margin-bottom: 40px; }
.pace-zone-list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.pace-zone-row {
  padding: 13px 16px;

  grid-template-columns: 1fr auto auto;
  gap: 14px;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.pace-zone-row:last-child { border-bottom: none; }
.pace-zone-row .label {

  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 10px;
}
.pace-zone-row .label .dot {
  width: 6px; height: 6px; border-radius: 50%;
}
.pace-zone-row .value {
  font-family: 'JetBrains Mono';
  font-size: 13px;
  color: var(--text);
  text-align: right;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.pace-zone-row .per400 {
  font-family: 'JetBrains Mono';
  font-size: 11px;
  color: var(--text-dim);
  text-align: right;
  min-width: 78px;
  white-space: nowrap;
}

/* Footer */
.footer {
  font-family: 'JetBrains Mono';
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: center;
  margin-top: 48px;
  line-height: 1.6;
}

/* Settings drawer */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 10;
  animation: fadeIn 0.15s ease-out;
}
.drawer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg);
  border-top: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  z-index: 11;
  padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  max-height: 88vh;
  overflow-y: auto;
  animation: slideUp 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}
@media (min-width: 640px) {
  .drawer {
    left: 50%;
    right: auto;
    bottom: auto;
    top: 50%;
    transform: translate(-50%, -50%);

    border-radius: 18px;
    border: 1px solid var(--border);

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp {
  from { transform: translateY(24px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes fadeInScale {
  from { transform: translate(-50%, -50%) scale(0.97); opacity: 0; }

  display: flex;
  align-items: center;
  justify-content: space-between;
}

  align-items: center;
  justify-content: center;
}

.reset-btn:active { color: var(--race); }

.setting-label {

  letter-spacing: 0.18em;
  text-transform: uppercase;

}
.date-input, .select-input {

}
.pace-input {
  width: 62px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 0;
  color: var(--text);
  font-family: 'JetBrains Mono';
  font-size: 16px;
  text-align: center;
}
.pace-input:focus { outline: none; border-color: var(--border-hover); }
.pace-sep { color: var(--text-muted); font-family: 'JetBrains Mono'; font-size: 18px; font-weight: 500; }
.pace-unit { font-size: 13px; color: var(--text-muted); margin-left: 8px; font-family: 'JetBrains Mono'; }
.day-picker {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.day-picker-btn {
  padding: 10px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono';
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.12s;
  font-weight: 500;

.day-picker-btn:hover { color: var(--text); border-color: var(--border-hover); }
.day-picker-btn.active {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.setting-hint {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 8px;
  line-height: 1.5;
}
.reset-btn {
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-family: 'JetBrains Mono';
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 8px 0;
  cursor: pointer;
  transition: color 0.15s;
}
.reset-btn:hover { color: var(--race); }

/* Language switch */
.lang-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.lang-btn {
  padding: 10px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text-muted);
  font-family: 'Inter';
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.12s;
}
.lang-btn:hover { color: var(--text); border-color: var(--border-hover); }
.lang-btn.active {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.lang-btn:active { transform: scale(0.98); }

/* Phase progression indicator */
.phase-progress {
  font-family: 'JetBrains Mono';
  font-size: 12px;
  color: var(--text-muted);
  margin: -2px 0 8px;
  letter-spacing: 0.02em;

  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

  border-radius: 4px;

  background: rgba(76, 195, 157, 0.14);
  color: var(--long);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

const pad2 = n => String(n).padStart(2, '0');
const formatPace = sec => { const m = Math.floor(sec/60), s = Math.round(sec%60); return `${m}:${pad2(s)}`; };
const todayLocal = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const parseDate = str => { const [y,m,d] = str.split('-').map(Number); return new Date(y, m-1, d); };
const formatDateISO = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const formatDateShort = d => `${d.getDate()} ${T.months[d.getMonth()]}`;
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
const dowMon = d => (d.getDay() + 6) % 7;
const mondayOfWeek = d => addDays(d, -dowMon(d));
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const STORAGE_KEY = 'hyroxRunner.v2';
const OLD_STORAGE_KEY = 'hyroxRunner.v1';

const DEFAULTS = {
  raceDate: '2026-10-28',

  language: 'en',
};
let state = { ...DEFAULTS, dayAssignments: [...DEFAULT_ASSIGNMENTS], settingsOpen: false, expandedDay: null };

function loadState() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const old = localStorage.getItem(OLD_STORAGE_KEY);
      if (old) {
        const saved = JSON.parse(old);
        const assignments = [null,null,null,null,null,null,null];
        if (Array.isArray(saved.hyroxDays)) for (const d of saved.hyroxDays) assignments[d] = 'hyrox';
        state.raceDate = saved.raceDate ?? DEFAULTS.raceDate;
        state.currentPaceSec = saved.currentPaceSec ?? DEFAULTS.currentPaceSec;
        state.dayAssignments = assignments;
        state.heaviestDay = saved.heaviestDay ?? null;
        state.language = saved.language ?? 'en';
        saveState();
        T = L[state.language] || L.en;
        return;
      }
    }
    if (raw) {
      const saved = JSON.parse(raw);
      state.raceDate = saved.raceDate ?? DEFAULTS.raceDate;
      state.currentPaceSec = saved.currentPaceSec ?? DEFAULTS.currentPaceSec;
      state.dayAssignments = Array.isArray(saved.dayAssignments) && saved.dayAssignments.length === 7
        ? saved.dayAssignments : [...DEFAULT_ASSIGNMENTS];
      state.heaviestDay = saved.heaviestDay ?? null;
      state.language = saved.language ?? 'en';
    }
  } catch(e) { console.warn('Load failed', e); }
  T = L[state.language] || L.en;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      raceDate: state.raceDate, currentPaceSec: state.currentPaceSec,
      dayAssignments: state.dayAssignments, heaviestDay: state.heaviestDay,
      language: state.language,
    }));
  } catch(e) { console.warn('Save failed', e); }
}

// ============================================================
// PHASE / WEEK / DELOAD LOGIC
// ============================================================
const PHASE_BOUNDS = {
  taper:    { start: 7,  end: 1  },   // 1-7 days
  sharpen:  { start: 21, end: 8  },   // 8-21
  racespec: { start: 42, end: 22 },   // 22-42
  build:    { start: 63, end: 43 },   // 43-63
  base:     { start: null, end: 64 }  // 64+ (open-ended)
};

function getPhase(daysToRace) {
  let key;
  if (daysToRace < 0) key = 'past';
  else if (daysToRace <= 7) key = 'taper';
  else if (daysToRace <= 21) key = 'sharpen';
  else if (daysToRace <= 42) key = 'racespec';
  else if (daysToRace <= 63) key = 'build';
  else key = 'base';
  return { key, label: T.phase[key]?.label ?? key, desc: T.phase[key]?.desc ?? '' };
}

function computeZones(paceSec) {
  return {
    easy:      { low: paceSec + 60, high: paceSec + 90 },
    threshold: { low: paceSec + 15, high: paceSec + 25 },
    target:    { low: paceSec + 0,  high: paceSec + 30 },
    vo2:       { low: paceSec - 15, high: paceSec - 5  },
    strides:   { low: paceSec - 45, high: paceSec - 30 },
  };
}

// Deload flag is per-CALENDAR-WEEK, anchored to Monday's daysToRace.
// Deloads sit at weeksFromRace = 4, 8, 12, ... (every 4th week backward from race).
// Skip when inside taper (daysToRace <= 7).
function computeIsDeload(mondayDaysToRace) {
  if (mondayDaysToRace <= 7) return false;
  const weeksFromRace = Math.ceil(mondayDaysToRace / 7);
  return weeksFromRace >= 4 && weeksFromRace % 4 === 0;
}

// Week within phase for a specific day (based on that day's daysToRace).
function computeWeekInPhase(daysToRace, phaseKey) {
  const b = PHASE_BOUNDS[phaseKey];
  if (!b || b.start === null) return { week: 1, total: null }; // base = open-ended
  const totalDays = b.start - b.end + 1;
  const totalWeeks = Math.ceil(totalDays / 7);
  const daysIn = b.start - daysToRace;
  const week = Math.min(totalWeeks, Math.max(1, Math.floor(daysIn / 7) + 1));
  return { week, total: totalWeeks };
}

// AUTO-FILL (unchanged from before — type assignment doesn't depend on deload/week)
// ============================================================
const HARD_TYPES = ['intervals','tempo','compromised'];
const circularDist = (a, b) => { const d = Math.abs(a-b); return Math.min(d, 7-d); };

function scorePlacement(placement, hyroxDays, heaviestDay) {
  let score = 0;
  const entries = Object.entries(placement);
  const hardDays = entries.filter(([,t]) => HARD_TYPES.includes(t)).map(([d]) => parseInt(d,10));
  for (const [dStr, type] of entries) {
    const d = parseInt(dStr,10);
    const isHard = HARD_TYPES.includes(type);
    if (isHard) {
      for (const hd of hardDays) {
        if (hd === d) continue;
        const dist = circularDist(d, hd);
        if (dist === 0) score -= 1000;
        else if (dist === 1) score -= 50;
        else if (dist >= 3) score += 2;
      }
    }
    for (const hd of hyroxDays) {
      const dist = circularDist(d, hd);
      if (dist === 1) {
        const isDayAfter = (hd + 1) % 7 === d;
        if (isDayAfter && heaviestDay !== null && heaviestDay === hd) score -= 15;
        else if (isHard) score -= 3;
        else score -= 0.5;
      }
    }
    if (type === 'intervals') score -= d * 0.3;
    else if (type === 'long' || type === 'compromised') score += d * 0.4;
  }
  return score;
}

function* permutations(arr, k) {
  if (k === 0) { yield []; return; }
  for (let i = 0; i < arr.length; i++) {
    const rest = arr.slice(0,i).concat(arr.slice(i+1));
    for (const p of permutations(rest, k-1)) yield [arr[i], ...p];
  }
}

function autoFillNormal(pinned, phase, heaviestDay) {
  const result = [...pinned];
  const autoIdx = [], hyroxDays = [], pinnedAssignments = {};
  const pinnedTypes = new Set();
  for (let d = 0; d < 7; d++) {
    if (result[d] === null) autoIdx.push(d);
    else {
      pinnedTypes.add(result[d]);
      pinnedAssignments[d] = result[d];
      if (result[d] === 'hyrox') hyroxDays.push(d);
    }
  }
  if (autoIdx.length === 0) return result;
  const isRaceSpec = ['racespec','sharpen'].includes(phase.key);
  const longType = isRaceSpec ? 'compromised' : 'long';
  const pinnedLongish = pinnedTypes.has('long') || pinnedTypes.has('compromised');
  const pinnedQCount = HARD_TYPES.filter(t => pinnedTypes.has(t)).length + (pinnedLongish ? 1 : 0);
  const totalPossible = autoIdx.length + pinnedQCount;
  let desired;
  if (totalPossible === 0) desired = [];
  else if (totalPossible === 1) desired = [isRaceSpec ? 'intervals' : 'tempo'];
  else if (totalPossible === 2) desired = ['intervals', longType];
  else desired = ['intervals', 'tempo', longType];
  const needed = [];
  for (const t of desired) {
    if (pinnedTypes.has(t)) continue;
    if ((t === 'long' || t === 'compromised') && pinnedLongish) continue;
    needed.push(t);
  }
  const toPlace = needed.slice(0, autoIdx.length);
  let bestScore = -Infinity, bestPlacement = {};
  if (toPlace.length > 0) {
    for (const dayCombo of permutations(autoIdx, toPlace.length)) {
      const placement = { ...pinnedAssignments };
      for (let i = 0; i < toPlace.length; i++) placement[dayCombo[i]] = toPlace[i];
      const s = scorePlacement(placement, hyroxDays, heaviestDay);
      if (s > bestScore) {
        bestScore = s; bestPlacement = {};
        for (let i = 0; i < toPlace.length; i++) bestPlacement[dayCombo[i]] = toPlace[i];
      }
    }
  }
  for (const [dStr, type] of Object.entries(bestPlacement)) result[parseInt(dStr,10)] = type;
  for (const d of autoIdx) if (result[d] === null) result[d] = 'shakeout';
  return result;
}

function autoFillTaper(pinned, todayDate, raceDate) {
  const result = [...pinned];
  const monday = mondayOfWeek(todayDate);
  for (let d = 0; d < 7; d++) {
    if (result[d] !== null) continue;
    const dayDate = addDays(monday, d);
    const dtr = daysBetween(dayDate, raceDate);
    if (dtr < 0) result[d] = 'shakeout';
    else if (dtr === 0) result[d] = 'race';
    else if (dtr === 1) result[d] = 'rest';
    else if (dtr === 2) result[d] = 'shakeout';
    else if (dtr === 3) result[d] = 'intervals';
    else result[d] = 'shakeout';
  }
  return result;
}

function fillWeek(pinned, phase, heaviestDay, todayDate, raceDate) {
  if (phase.key === 'taper') return autoFillTaper(pinned, todayDate, raceDate);
  return autoFillNormal(pinned, phase, heaviestDay);
}

// ============================================================
// SESSION CONTENT
// ============================================================
const pRange = z => `${formatPace(z.low)}\u2013${formatPace(z.high)}/km`;
const per400 = z => `${formatPace(z.low * 0.4)}\u2013${formatPace(z.high * 0.4)}`;
const per1k  = z => `${formatPace(z.low)}\u2013${formatPace(z.high)}`;

// Round to nearest, minimum 1
const dloadInt = (n, mult, min = 1) => Math.max(min, Math.round(n * mult));
const dloadDur = (n, mult, step = 5) => Math.max(step, Math.round((n * mult) / step) * step);

// Given a type and phase-context, build the args object the translation functions consume.
function buildArgs(type, phase, zones, ctx) {
  const isDeload = !!ctx.isDeload;
  const mult = isDeload ? 0.6 : 1;
  const week = ctx.weekInPhase || 1;

  const args = {
    isDeload,
    easy: pRange(zones.easy),
    thr: pRange(zones.threshold),
    p400: per400(zones.target),
    p1k: per1k(zones.target),
    vo2Low: formatPace(zones.vo2.low),
    vo2High: formatPace(zones.vo2.high),
    dtr: ctx.daysToRaceForDay,
  };

  if (type === 'intervals') {
    if (phase.key === 'racespec') args.reps = dloadInt(5 + week, mult);              // wk1:6 wk2:7 wk3:8
    else if (phase.key === 'sharpen') args.reps = dloadInt(3 + week, mult);          // wk1:4 wk2:5
    else if (phase.key === 'build') args.reps = dloadInt(Math.min(6, 3 + week), mult); // wk1:4 wk2:5 wk3:6
    else if (phase.key === 'base') args.reps = dloadInt(Math.min(8, 4 + week), mult, 4); // 5,6,7,8 cap
    else args.reps = 4;
  }
  if (type === 'tempo') {
    if (phase.key === 'racespec') { args.sets = 3; args.blockMin = dloadInt(6 + 2*week, mult, 4); }  // 8,10,12
    else if (phase.key === 'sharpen') { args.sets = isDeload ? 2 : 3; args.blockMin = 8; }
    else if (phase.key === 'build') { args.sets = 3; args.blockMin = dloadInt(Math.min(10, 6 + 2*week), mult, 4); } // 8,10,10
    else if (phase.key === 'base') args.durationMin = dloadDur(Math.min(30, 15 + 5*week), mult); // 20,25,30
    else args.durationMin = 10;
  }
  if (type === 'long') {
    if (phase.key === 'racespec') args.durationMin = dloadDur(45 + 5*week, mult);   // 50,55,60
    else if (phase.key === 'sharpen') args.durationMin = dloadDur(50 + 5*week, mult); // 55,60
    else if (phase.key === 'build') args.durationMin = dloadDur(50 + 5*week, mult);   // 55,60,65
    else if (phase.key === 'base') args.durationMin = dloadDur(Math.min(60, 40 + 5*week), mult, 5); // 45..60
    else args.durationMin = 35;
  }
  if (type === 'compromised') {
    if (phase.key === 'racespec') {
      // wk1: 1 station + 1 rep; wk2: 1 + 2; wk3: 2 + 2
      const stationsBase = week >= 3 ? 2 : 1;
      const repsBase = Math.min(2, week);
      args.stations = isDeload ? 1 : stationsBase;
      args.reps1k = isDeload ? 1 : repsBase;
    } else if (phase.key === 'sharpen') {
      // wk1: 3 stations + 3 reps; wk2: 4 + 4 (half sim)
      args.stations = isDeload ? 2 : (week === 1 ? 3 : 4);
      args.reps1k = isDeload ? 2 : (week === 1 ? 3 : 4);
    } else {
      args.stations = 1;
      args.reps1k = 1;
    }
  }
  return args;
}

function wrap(variant, color, args = {}) {
  const resolve = v => (typeof v === 'function' ? v(args) : v);
  return {
    color,
    title: resolve(variant.title),
    pace: resolve(variant.pace),
    details: resolve(variant.details),
    why: resolve(variant.why),
  };
}

function getSessionByType(type, phase, zones, ctx = {}) {
  const S = T.session;
  const args = buildArgs(type, phase, zones, ctx);
  const isTaper = phase.key === 'taper';

  if (type === 'race' || ctx.isRaceDay) return wrap(S.race, 'race', args);

  if (type === 'hyrox') {
    if (isTaper) return wrap(S.hyroxTaper, 'hyrox', args);
    return wrap(S.hyroxNormal, 'hyrox', args);
  }
  if (type === 'rest') {
    if (isTaper && ctx.daysToRaceForDay === 1) return wrap(S.restEve, 'shakeout', args);
    return wrap(S.restNormal, 'shakeout', args);
  }
  if (type === 'shakeout') {
    if (isTaper && ctx.daysToRaceForDay === 2) return wrap(S.shakeoutEve, 'shakeout', args);
    return wrap(S.shakeoutNormal, 'shakeout', args);
  }
  if (type === 'long') {
    if (isTaper) return wrap(S.longTaper, 'long', args);
    return wrap(S.longNormal, 'long', args);
  }
  if (type === 'intervals') {
    if (isTaper) return wrap(S.intervalsTaper, 'intervals', args);
    if (phase.key === 'sharpen') return wrap(S.intervalsSharpen, 'intervals', args);
    if (phase.key === 'racespec') return wrap(S.intervalsRaceSpec, 'intervals', args);
    if (phase.key === 'build') return wrap(S.intervalsBuild, 'intervals', args);
    return wrap(S.intervalsBase, 'intervals', args);
  }
  if (type === 'tempo') {
    if (isTaper) return wrap(S.tempoTaper, 'tempo', args);
    if (phase.key === 'sharpen') return wrap(S.tempoSharpen, 'tempo', args);
    if (phase.key === 'racespec') return wrap(S.tempoRaceSpec, 'tempo', args);
    if (phase.key === 'build') return wrap(S.tempoBuild, 'tempo', args);
    return wrap(S.tempoBase, 'tempo', args);
  }
  if (type === 'compromised') {
    if (isTaper) return wrap(S.compromisedTaper, 'compromised', args);
    if (phase.key === 'sharpen') return wrap(S.compromisedSharpen, 'compromised', args);
    if (phase.key === 'racespec') return wrap(S.compromisedRaceSpec, 'compromised', args);
    return wrap(S.compromisedNormal, 'compromised', args);
  }
  return wrap(S.fallback, 'shakeout', args);
}

function buildWeek() {
  const today = todayLocal();
  const raceDate = parseDate(state.raceDate);
  const daysToRace = daysBetween(today, raceDate);
  const phase = getPhase(daysToRace);
  const zones = computeZones(state.currentPaceSec);
  const monday = mondayOfWeek(today);

  // Deload is a whole-calendar-week flag (anchored to Monday's daysToRace).
  const mondayDtr = daysBetween(monday, raceDate);
  const isDeloadWeek = computeIsDeload(mondayDtr);

  // Today's week-in-phase for the header display.
  const todayWeekCtx = computeWeekInPhase(daysToRace, phase.key);

  const filled = fillWeek(state.dayAssignments, phase, state.heaviestDay, today, raceDate);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const date = addDays(monday, i);
    const dtrForDay = daysBetween(date, raceDate);
    const isToday = daysBetween(today, date) === 0;
    const isRaceDay = dtrForDay === 0;
    const dayPhase = getPhase(dtrForDay);
    const dayWeekCtx = computeWeekInPhase(dtrForDay, dayPhase.key);
    const type = filled[i];
    const pinnedType = state.dayAssignments[i];
    const session = getSessionByType(type, dayPhase, zones, {
      daysToRaceForDay: dtrForDay,
      isRaceDay,
      isDeload: isDeloadWeek && !isRaceDay && dayPhase.key !== 'taper',
      weekInPhase: dayWeekCtx.week,
    });
    days.push({
      dayIndex: i, date, isToday, isRaceDay,
      effectiveType: type, pinnedType, session,
      isDeload: isDeloadWeek && !isRaceDay && dayPhase.key !== 'taper',
    });
  }
  return { today, raceDate, daysToRace, phase, zones, days, isDeloadWeek, todayWeekCtx };
}

// ============================================================
// TEMPLATES
// ============================================================
const iconGear = () => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 10v6m8.66-15.66-4.24 4.24m-8.84 8.84L3.34 20.66M23 12h-6m-10 0H1m20.66 8.66-4.24-4.24m-8.84-8.84L3.34 3.34"/></svg>`;
const iconClose = () => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;

function template() {
  const w = buildWeek();
  const todayObj = w.days.find(d => d.isToday);
  const expandedIdx = state.expandedDay === null ? (todayObj ? todayObj.dayIndex : -1) : state.expandedDay;

  // Progress line
  let progressLine = '';
  if (w.todayWeekCtx.total && w.phase.key !== 'past' && w.phase.key !== 'taper') {
    progressLine = `<div class="phase-progress"><span>${escapeHtml(T.weekOf(w.todayWeekCtx.week, w.todayWeekCtx.total))}</span>${w.isDeloadWeek ? `<span class="deload-badge">${escapeHtml(T.deloadBadge)}</span>` : ''}</div>`;
  } else if (w.isDeloadWeek && w.phase.key !== 'past' && w.phase.key !== 'taper') {
    progressLine = `<div class="phase-progress"><span class="deload-badge">${escapeHtml(T.deloadBadge)}</span></div>`;
  }

  return `
    <div class="app">
      <header class="header">
        <div class="wordmark">Hyrox Runner</div>
        <button class="settings-btn" data-action="open-settings" aria-label="${escapeHtml(T.settings)}">${iconGear()}</button>
      </header>
      <section class="phase-hero">
        <div class="phase-eyebrow">${formatDateShort(w.today)} \u00b7 ${T.days.full[dowMon(w.today)]}</div>
        <h1 class="phase-label">${escapeHtml(w.phase.label)}</h1>
        ${progressLine}
        <div class="phase-meta">
          ${w.daysToRace < 0
            ? `<span class="num">${escapeHtml(T.racePassed)}</span>`
            : w.daysToRace === 0
              ? `<span class="num">${escapeHtml(T.raceToday)}</span>`
              : `<span class="num">${escapeHtml(T.daysToRace(w.daysToRace))}</span> \u00b7 <span class="num">${formatDateShort(w.raceDate)}</span>`
          }
        </div>
        <p class="phase-desc">${escapeHtml(w.phase.desc)}</p>
        ${w.isDeloadWeek && w.phase.key !== 'taper' ? `<p class="phase-desc" style="color:var(--long);margin-top:8px;">${escapeHtml(T.deloadNote)}</p>` : ''}
      </section>
      ${w.phase.key === 'taper' && w.daysToRace > 0 ? raceWeekBanner(w) : ''}
      ${todayObj ? todaySection(todayObj) : ''}
      <section class="week">
        <div class="section-title">${escapeHtml(T.thisWeek)}</div>
        <div class="section-hint">${escapeHtml(T.thisWeekHint)}</div>
        <div class="week-list">
          ${w.days.map(d => dayRow(d, expandedIdx)).join('')}
        </div>
      </section>
      <section class="pace-zones">
        <div class="section-title">${escapeHtml(T.paceZones)} \u00b7 ${escapeHtml(T.paceZonesSub(formatPace(state.currentPaceSec)))}</div>
        <div class="pace-zone-list">
          ${paceZoneRow(T.zones.easy, w.zones.easy, 'long')}
          ${paceZoneRow(T.zones.threshold, w.zones.threshold, 'tempo')}
          ${paceZoneRow(T.zones.target, w.zones.target, 'compromised')}
          ${paceZoneRow(T.zones.vo2, w.zones.vo2, 'intervals')}
          ${paceZoneRow(T.zones.strides, w.zones.strides, 'race')}
        </div>
      </section>
      <footer class="footer">
        ${escapeHtml(T.footerLine1)}<br>
        ${escapeHtml(T.footerLine2)}
      </footer>
    </div>
    ${state.settingsOpen ? settingsDrawer() : ''}
  `;
}

function raceWeekBanner(w) {
  return `
    <div class="race-week-banner">
      <div class="label">${escapeHtml(T.raceWeekTitle)}</div>
      <div class="title">${escapeHtml(T.daysToGo(w.daysToRace))}</div>
      <div class="desc">${escapeHtml(T.raceWeekDesc)}</div>
    </div>
  `;
}

function todaySection(d) {
  const s = d.session;
  const glowVar = `--accent-glow: var(--${s.color});`;
  return `
    <section class="today" style="${glowVar}">
      <div class="today-eyebrow">
        <span>${escapeHtml(T.todayLabel)} \u00b7 ${formatDateShort(d.date)}</span>
        ${d.isRaceDay ? `<span style="color:var(--race);">\u25cf ${escapeHtml(T.raceDayLabel)}</span>` : ''}
        ${d.pinnedType && !d.isRaceDay ? `<span style="color:var(--text-dim);">\u25cf ${escapeHtml(T.pinnedLabel)}</span>` : ''}
        ${d.isDeload ? `<span class="deload-badge">${escapeHtml(T.deloadBadge)}</span>` : ''}
      </div>
      <h2 class="today-title">
        <span class="dot" style="background: var(--${s.color}); color: var(--${s.color});"></span>
        ${escapeHtml(s.title)}
      </h2>
      ${s.pace !== '\u2014' ? `<div class="today-pace">${escapeHtml(s.pace)}</div>` : ''}
      <div class="today-details">${escapeHtml(s.details)}</div>
      ${s.why ? `<div class="today-why">${escapeHtml(s.why)}</div>` : ''}
    </section>
  `;
}

function dayRow(d, expandedIdx) {
  const s = d.session;
  const isExpanded = d.dayIndex === expandedIdx;
  const classes = ['day-row'];
  if (d.isToday) classes.push('is-today');
  if (d.isRaceDay) classes.push('is-race');
  if (isExpanded) classes.push('is-expanded');
  if (d.isDeload) classes.push('is-deload');
  return `
    <div class="${classes.join(' ')}">
      <div class="day-row-header" data-action="expand-day" data-day="${d.dayIndex}">
        <div class="day-row-label">
          <span>${T.days.short[d.dayIndex]} ${d.date.getDate()}</span>
          ${d.pinnedType && !d.isRaceDay ? `<span class="pin-dot" title="${escapeHtml(T.pinnedLabel)}"></span>` : ''}
        </div>
        <div class="day-row-title">
          <span class="dot" style="background: var(--${s.color});"></span>
          <span>${escapeHtml(s.title)}</span>
        </div>
        <div class="day-row-caret">\u203a</div>
      </div>
      ${isExpanded ? `
        <div class="day-row-expanded">
          ${!d.isRaceDay ? typePicker(d.dayIndex, d.pinnedType) : ''}
          ${s.pace !== '\u2014' ? `<div class="pace-line">${escapeHtml(s.pace)}</div>` : ''}
          <div>${escapeHtml(s.details)}</div>
          ${s.why ? `<div class="why">${escapeHtml(s.why)}</div>` : ''}
        </div>
      ` : ''}
    </div>
  `;
}

const TYPE_KEYS = ['','hyrox','intervals','tempo','long','compromised','shakeout','rest'];
function typePicker(dayIdx, pinnedType) {
  const current = pinnedType || '';
  return `
    <div class="type-picker-label">${escapeHtml(T.sessionType)}</div>
    <div class="type-picker">
      ${TYPE_KEYS.map(key => {
        const label = key === '' ? T.types.auto : T.types[key];
        return `<button class="type-chip ${key === '' ? 'type-auto' : ''} ${current === key ? 'active' : ''}"
                  data-action="set-type" data-day="${dayIdx}" data-type="${key}">${escapeHtml(label)}</button>`;
      }).join('')}
    </div>
  `;
}

function paceZoneRow(label, zone, colorKey) {
  return `
    <div class="pace-zone-row">
      <div class="label"><span class="dot" style="background: var(--${colorKey});"></span>${escapeHtml(label)}</div>
      <div class="value">${formatPace(zone.low)}\u2013${formatPace(zone.high)}/km</div>
      <div class="per400">${formatPace(zone.low * 0.4)}\u2013${formatPace(zone.high * 0.4)}/400m</div>
    </div>
  `;
}

function settingsDrawer() {
  const paceMin = Math.floor(state.currentPaceSec / 60);
  const paceSec = state.currentPaceSec % 60;
  const hyroxDayIdxs = state.dayAssignments.map((v,i) => v === 'hyrox' ? i : -1).filter(i => i !== -1);
  const heaviestOptions = hyroxDayIdxs.map(i =>
    `<option value="${i}" ${state.heaviestDay===i?'selected':''}>${escapeHtml(T.days.full[i])}</option>`
  ).join('');
  const heaviestDisabled = hyroxDayIdxs.length === 0;

  return `
    <div class="drawer-backdrop" data-action="close-settings"></div>
    <div class="drawer" role="dialog" aria-label="${escapeHtml(T.settings)}">
      <div class="drawer-handle"></div>
      <div class="drawer-title">
        ${escapeHtml(T.settings)}
        <button class="drawer-close" data-action="close-settings" aria-label="${escapeHtml(T.close)}">${iconClose()}</button>
      </div>

      <div class="setting-group">
        <label class="setting-label">${escapeHtml(T.language)}</label>
        <div class="lang-switch">
          <button class="lang-btn ${state.language==='en'?'active':''}" data-action="set-lang" data-lang="en">English</button>
          <button class="lang-btn ${state.language==='nl'?'active':''}" data-action="set-lang" data-lang="nl">Nederlands</button>
        </div>
      </div>

      <div class="setting-group">
        <label class="setting-label" for="race-date-input">${escapeHtml(T.raceDate)}</label>
        <input type="date" class="date-input" id="race-date-input" value="${state.raceDate}">
      </div>

      <div class="setting-group">
        <label class="setting-label">${escapeHtml(T.currentPace)}</label>
        <div class="pace-input-group">
          <input type="number" class="pace-input" id="pace-min-input" min="2" max="10" step="1" value="${paceMin}" inputmode="numeric">
          <span class="pace-sep">:</span>
          <input type="number" class="pace-input" id="pace-sec-input" min="0" max="59" step="1" value="${pad2(paceSec)}" inputmode="numeric">
          <span class="pace-unit">${escapeHtml(T.paceUnit)}</span>
        </div>
        <div class="setting-hint">${escapeHtml(T.paceHint)}</div>
      </div>

      <div class="setting-group">
        <label class="setting-label">${escapeHtml(T.hyroxDays)}</label>
        <div class="day-picker">
          ${T.days.two.map((d, i) => `
            <button class="day-picker-btn ${state.dayAssignments[i] === 'hyrox' ? 'active' : ''}" data-action="toggle-hyrox" data-day="${i}" aria-pressed="${state.dayAssignments[i] === 'hyrox'}">${d}</button>
          `).join('')}
        </div>
        <div class="setting-hint">${escapeHtml(T.hyroxDaysHint)}</div>
      </div>

      <div class="setting-group">
        <label class="setting-label" for="heaviest-day-select">${escapeHtml(T.heaviestDay)}</label>
        <select class="select-input" id="heaviest-day-select" ${heaviestDisabled?'disabled':''}>
          <option value="">${escapeHtml(T.variesWeekly)}</option>
          ${heaviestOptions}
        </select>
        <div class="setting-hint">${escapeHtml(T.heaviestDayHint)}</div>
      </div>

      <div class="setting-group" style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border);margin-top:24px;">
        <div class="setting-hint" style="margin:0;">${escapeHtml(T.savedInBrowser)}</div>
        <button class="reset-btn" data-action="reset-settings">${escapeHtml(T.resetWeek)}</button>
      </div>
    </div>
  `;
}

// ============================================================
// EVENT HANDLERS
// ============================================================
const root = document.getElementById('root');

function render() {
  const scrollY = window.scrollY;
  root.innerHTML = template();
  window.scrollTo({ top: scrollY });
}

function handleClick(e) {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  if (action === 'open-settings') { state.settingsOpen = true; render(); }
  else if (action === 'close-settings') { state.settingsOpen = false; render(); }
  else if (action === 'expand-day') {
    const day = parseInt(target.dataset.day, 10);
    state.expandedDay = state.expandedDay === day ? -1 : day;
    render();
  } else if (action === 'set-type') {
    const day = parseInt(target.dataset.day, 10);
    const type = target.dataset.type;
    state.dayAssignments[day] = type === '' ? null : type;
    if (state.heaviestDay === day && state.dayAssignments[day] !== 'hyrox') state.heaviestDay = null;
    saveState(); render();
  } else if (action === 'toggle-hyrox') {
    const day = parseInt(target.dataset.day, 10);
    if (state.dayAssignments[day] === 'hyrox') {
      state.dayAssignments[day] = null;
      if (state.heaviestDay === day) state.heaviestDay = null;
    } else state.dayAssignments[day] = 'hyrox';
    saveState(); render();
  } else if (action === 'reset-settings') {
    state.dayAssignments = [...DEFAULT_ASSIGNMENTS];
    state.heaviestDay = null;
    saveState(); render();
  } else if (action === 'set-lang') {
    const lang = target.dataset.lang;
    if (L[lang]) {
      state.language = lang;
      T = L[lang];
      document.documentElement.lang = lang;
      saveState(); render();
    }
  }
}

function handleChange(e) {
  const id = e.target.id;
  if (id === 'race-date-input') {
    if (e.target.value) { state.raceDate = e.target.value; saveState(); render(); }
  } else if (id === 'pace-min-input' || id === 'pace-sec-input') {
    const minEl = document.getElementById('pace-min-input');
    const secEl = document.getElementById('pace-sec-input');
    if (!minEl || !secEl) return;
    const min = Math.max(2, Math.min(10, parseInt(minEl.value,10) || 5));
    const sec = Math.max(0, Math.min(59, parseInt(secEl.value,10) || 0));
    state.currentPaceSec = min * 60 + sec;
    saveState(); render();
  } else if (id === 'heaviest-day-select') {
    const v = e.target.value;
    state.heaviestDay = v === '' ? null : parseInt(v,10);
    saveState(); render();
  }
}

document.addEventListener('click', handleClick);
document.addEventListener('change', handleChange);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.settingsOpen) { state.settingsOpen = false; render(); }
});

loadState();
document.documentElement.lang = state.language;
render();
</script>
