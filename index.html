<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="description" content="Evidence-based Hyrox running planner">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hyrox">
<meta name="application-name" content="Hyrox Runner">
<meta name="format-detection" content="telephone=no">
<title>Hyrox Runner</title>

<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

<!--
  The webfonts are a progressive enhancement, never a dependency: they load
  without blocking paint, and the app falls back to the system stack, which
  on iOS is SF Pro. That is what makes a cold offline launch look right.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

<style>
  /* Painted before the app boots so a cold start never flashes white. */
  html { background: #0a0a0b; }
  @media (prefers-color-scheme: light) { html { background: #fafafa; } }
</style>
</head>
<body>
<div id="root"></div>
<noscript style="display:block;padding:40px 24px;font-family:system-ui;color:#f0f0f2;text-align:center;">
  Hyrox Runner needs JavaScript enabled.
</noscript>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
